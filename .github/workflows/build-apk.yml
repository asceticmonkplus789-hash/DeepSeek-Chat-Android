name: Build Android APK

on:
  push:
    branches: [ui-optimize, main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Install Capacitor wrapper dependencies
        working-directory: android-wrap
        run: npm install --no-package-lock

      - name: Add Android platform
        working-directory: android-wrap
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: android-wrap
        run: npx cap sync android

      - name: Point Gradle at Android SDK
        working-directory: android-wrap
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android-wrap/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatdemo-debug-apk
          path: android-wrap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
